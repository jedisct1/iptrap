
[package]
keywords = ["tcp", "honeypot", "sinkhole", "network", "security"]
name = "iptrap"
version = "1.0.10"
authors = ["Frank Denis <github@pureftpd.org>"]
description = "Stateless TCP sinkhole and honeypot using SYN cookies, with initial payload capture and JSON logging"
license = "ISC"
homepage = "https://github.com/jedisct1/iptrap"
repository = "https://github.com/jedisct1/iptrap"
categories = ["command-line-utilities"]
edition = "2021"
readme = "README.md"

[dependencies]
zmq = "0.10.0"
coarsetime = "0.1.37"
serde = "1.0.229"
serde_json = "1.0.151"
rand = "0.9.5"
libc = "0.2.189"
log = "0.4.34"
siphasher = "1.0.3"

[lib]
name = "iptrap"
path = "src/lib.rs"

[profile.release]
codegen-units = 1
incremental = false
panic = "abort"
